name: android
# The phone tracker (android/). Its APK goes to its own release, "android-latest", never marked
# Latest: the Windows app auto-updates from releases/latest and downloads DaiseyTracker.exe
# from it, so an Android release there would break both.
on:
  push:
    branches: [main, "claude/**", "ccr-*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Keystore (optional; without it the APK is debug-signed)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"; fi
      - name: Build
        working-directory: android
        env:
          BUILD_NUMBER: "${{ github.run_number }}"
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../DaiseyTracker.apk
          else
            gradle --no-daemon assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../DaiseyTracker.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: DaiseyTracker-android, path: DaiseyTracker.apk }
      - name: Release (default branch only; android-latest, not marked Latest)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --latest=false --title "Android tracker" --notes "The phone tracker. Install DaiseyTracker.apk, allow Usage access, Connect."
          gh release upload android-latest DaiseyTracker.apk --clobber
      - name: Test release (work branches; pre-release, so never Latest and never seen by the Windows updater)
        if: github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --latest=false --target "$GITHUB_SHA" --title "Android tracker (test build)" --notes "Test builds from work branches. Install DaiseyTracker.apk, allow Usage access, Connect."
          gh release upload android-test DaiseyTracker.apk --clobber
