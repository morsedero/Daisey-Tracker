name: build
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Publish single-file exe (no .NET install needed to run)
        run: dotnet publish src/DaiseyTracker/DaiseyTracker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with: { name: DaiseyTracker, path: out/DaiseyTracker.exe }
